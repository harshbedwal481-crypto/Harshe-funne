function mapSheet(){sheet('🌌 Discovery map','<canvas id="mapc"></canvas><div style="text-align:center"><button class="btn" id="mz1" aria-label="Zoom in">＋</button><button class="btn" id="mz2" aria-label="Zoom out">－</button><button class="btn" id="mz3">Reset</button></div><p style="color:var(--mu);font-size:13px;text-align:center">Drag to pan · zoom to read names · tap a star to inspect it</p>');
 const c=$('mapc'),ctx=c.getContext('2d');c.width=c.clientWidth*(devicePixelRatio||1);c.height=c.clientHeight*(devicePixelRatio||1);const D=devicePixelRatio||1;
 const ang={Fire:0,Earth:1.57,Water:3.14,Air:4.71},P={};const names=Object.keys(st.found).sort((a,b)=>(find(a).d||0)-(find(b).d||0));
 names.forEach(n=>{const e=find(n),f=st.found[n];let a=ang[n];if(a==null){const pa=ang[f.a]??0,pb=ang[f.b]??0;a=Math.atan2(Math.sin(pa)+Math.sin(pb),Math.cos(pa)+Math.cos(pb))+((hash(n)%1000)/1000-.5)*.45;ang[n]=a}const r=isBase(n)?38:70+(e.d||1)*50+(hash(n+'r')%30);P[n]={x:Math.cos(a)*r,y:Math.sin(a)*r,n}});
 mp.pos=Object.values(P);mp.s=Math.min(1,c.clientWidth/900)*1.1;mp.ox=0;mp.oy=0;
 const draw=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.setTransform(D*mp.s,0,0,D*mp.s,c.width/2+mp.ox*D,c.height/2+mp.oy*D);
  ctx.lineWidth=1/mp.s;for(const n of names){const f=st.found[n];if(!f.a||!P[f.a]||!P[f.b])continue;ctx.strokeStyle=CM[find(n).c][3]+'44';ctx.beginPath();ctx.moveTo(P[f.a].x,P[f.a].y);ctx.lineTo(P[n].x,P[n].y);ctx.lineTo(P[f.b].x,P[f.b].y);ctx.stroke()}
  ctx.textAlign='center';for(const p of mp.pos){const e=find(p.n);ctx.fillStyle=CM[e.c][3];ctx.beginPath();ctx.arc(p.x,p.y,isBase(p.n)?8:4,0,7);ctx.fill();if(mp.s>.55){ctx.font=(mp.s>1?14:12)/mp.s*(mp.s>.9?1:1.4)+'px sans-serif';ctx.fillText(e.e,p.x,p.y-8/mp.s);if(mp.s>1.1){ctx.fillStyle='#cfe';ctx.font=11/mp.s+'px sans-serif';ctx.fillText(p.n,p.x,p.y+14/mp.s)}}}
  mp.raf=requestAnimationFrame(draw)};draw();
 c.onpointerdown=e=>{mp.drag={x:e.clientX,y:e.clientY,m:0};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!mp.drag)return;const dx=e.clientX-mp.drag.x,dy=e.clientY-mp.drag.y;if(Math.abs(dx)+Math.abs(dy)>3)mp.drag.m=1;mp.ox+=dx;mp.oy+=dy;mp.drag.x=e.clientX;mp.drag.y=e.clientY};
 c.onpointerup=e=>{if(mp.drag&&!mp.drag.m){const r=c.getBoundingClientRect(),mx=(e.clientX-r.left-r.width/2-mp.ox)/mp.s,my=(e.clientY-r.top-r.height/2-mp.oy)/mp.s;let b=null,bd=18/mp.s;for(const p of mp.pos){const d=Math.hypot(p.x-mx,p.y-my);if(d<bd){bd=d;b=p.n}}if(b){stopMap();sheet(b,card(b))}}mp.drag=null};
 c.onwheel=e=>{e.preventDefault();mp.s=Math.max(.2,Math.min(4,mp.s*(e.deltaY<0?1.15:.87)))};
 $('mz1').onclick=()=>mp.s=Math.min(4,mp.s*1.3);$('mz2').onclick=()=>mp.s=Math.max(.2,mp.s/1.3);$('mz3').onclick=()=>{mp.s=Math.min(1,c.clientWidth/900)*1.1;mp.ox=mp.oy=0}}

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Light</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#04050b;--pn:#0d1220;--tx:#f1e8d0;--mu:#8e8a78;--gl:#ffd98a;--bd:#3a3220;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}
#st{position:relative;width:min(100%,calc(100dvh*1.538));aspect-ratio:640/416}
canvas{width:100%;height:100%;display:block;touch-action:none;background:#000}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(3,4,10,.86);overflow:auto}
.box{width:100%;max-width:400px;text-align:center}
h1{font-size:clamp(1.6rem,6vw,2.6rem);margin:0 0 4px;color:var(--gl);letter-spacing:.14em;text-shadow:0 0 20px var(--gl),0 0 50px #ff9d3d}
h2{margin:0 0 8px;color:var(--gl);text-shadow:0 0 14px var(--gl)}
p{margin:6px 0}.mu{color:var(--mu);font-size:.9rem}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:9px 14px;cursor:pointer;width:100%;margin:4px 0}
button:hover{border-color:var(--gl);box-shadow:0 0 14px rgba(255,217,138,.4)}
button:focus-visible{outline:3px solid var(--gl);outline-offset:2px}
.go{background:var(--gl);color:#1a1204;font-weight:700;border:0}
.it{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;margin:5px 0;text-align:left;background:var(--pn)}
.lk{opacity:.4}
</style></head><body>
<div id="st"><canvas id="c" width="640" height="416"></canvas><div id="ov"></div></div>
<script>
const $=s=>document.querySelector(s),cv=$("#c"),x=cv.getContext("2d"),KEY="lastlight-v1",C=20,R=13,T=32,W=640,H=416;
const dk=document.createElement("canvas");dk.width=W;dk.height=H;const d=dk.getContext("2d");
const PL=[{n:"Forest",f:"#0e2318",w:"#24572f",a:"#3a8a4f"},{n:"Ruins",f:"#1d1b27",w:"#54506f",a:"#7c77a3"},{n:"Caves",f:"#1f1712",w:"#59432f",a:"#8a6544"},{n:"Underground",f:"#0d1b24",w:"#2b536b",a:"#4a8cb0"}];
const AC=[["lit","First Spark","Complete a level"],["st","Star Gazer","Collect 10 stars in total"],["fz","Shadow Tamer","Hold shadows frozen for 30s in total"],["bs","Boss Slayer","Defeat a Shadow Boss"],["dp","Deep Diver","Reach level 6"]];
const BN=["Umbra: fast hunter","Veil: births minions","Eclipse: hungry dark"];
let D=load(),G=null,L=null,K={},A=null,J=null,last=0,ang=0,toastT=0,msg="";
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.bt)return j}catch(e){}return{lvl:1,best:0,stars:0,bt:{},ach:{},fz:0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hyp=Math.hypot,say=(s)=>{msg=s;toastT=2.5};
function gen(n){const r=rng(n*7717+5),g=[],used=new Set;
 for(let j=0;j<R;j++){g[j]=[];for(let i=0;i<C;i++)g[j][i]=i==0||j==0||i==C-1||j==R-1?1:0}
 for(let k=0;k<17;k++){const i=2+Math.floor(r()*(C-4)),j=2+Math.floor(r()*(R-4));if((i<5&&(j<4||j>7))||(i>=10&&i<=14))continue;g[j][i]=1;if(r()<.5&&i<9)g[j][i+1]=1}
 for(let j=1;j<R-1;j++)g[j][12]=1;const gp=2+Math.floor(r()*(R-5));g[gp][12]=2;g[gp][11]=g[gp][13]=g[gp-1][11]=g[gp+1][11]=0;
 for(let i=1;i<=3;i++)g[9][i]=1;g[10][3]=1;g[11][3]=3;g[10][1]=g[10][2]=g[11][1]=g[11][2]=0;
 const fr=(a,b)=>{for(let q=0;q<99;q++){const i=a+Math.floor(r()*(b-a+1)),j=1+Math.floor(r()*(R-2));if(!g[j][i]&&!(i<4&&(j<4||j>8))&&!used.has(i+","+j)){used.add(i+","+j);return{x:(i+.5)*T,y:(j+.5)*T}}}return{x:a*T+16,y:T*1.5}};
 const nt=Math.min(4,2+Math.floor(n/3)),ord=[...Array(nt).keys()].map(i=>i+1).sort(()=>r()-.5);
 const tw=ord.map((o,k)=>({...(k%2?fr(1,10):fr(13,18)),n:o,on:0}));
 const it=[{...fr(1,10),k:"k"},{...fr(1,10),k:"b"},{...fr(1,10),k:"b"},{...fr(13,18),k:"b"},{...fr(13,18),k:"c"},{...fr(1,10),k:"s"},{...fr(13,18),k:"s"},{x:1.5*T,y:10.5*T,k:"s"},{x:2.5*T,y:11.5*T,k:"c"}];
 const boss=n%3==0?{x:16*T,y:6*T,hp:nt,type:(n/3-1)%3,fr:0,res:0,sp:0,b:1}:null;
 return{g,tw,it,sw:{...fr(1,10)},swOn:0,key:0,nxt:1,t:0,stars:0,pal:PL[(n-1)%4],boss,gp}}
function begin(n,fresh){if(fresh)G={lives:3,score:0,frz:0};G.lv=n;L=gen(n);G.p={x:48,y:48};G.sh=L.boss?[L.boss]:[];G.bat=100;G.sp=4;G.inv=0;G.on=1;G.fz=0;G.ct=0;
 $("#ov").style.display="none";say(L.boss?"Boss: "+BN[L.boss.type]:"Level "+n+" · "+L.pal.n)}
const blk=(px,py)=>{for(const[a,b]of[[-8,-8],[8,-8],[-8,8],[8,8]]){const i=Math.floor((px+a)/T),j=Math.floor((py+b)/T),t=L.g[j]?L.g[j][i]:1;
 if(t===1||t===3)return 1;if(t===2){if(L.key){L.g[j][i]=0;L.key=0;say("The door unlocks")}else return 1}}return 0};
function mv(o,dx,dy){if(!blk(o.x+dx,o.y))o.x+=dx;if(!blk(o.x,o.y+dy))o.y+=dy}
function step(dt){const g=G,p=g.p;L.t+=dt;g.inv=Math.max(0,g.inv-dt);toastT-=dt;
 let mx=(K.ArrowRight||K.d?1:0)-(K.ArrowLeft||K.a?1:0),my=(K.ArrowDown||K.s?1:0)-(K.ArrowUp||K.w?1:0);
 if(J){const a=J.x-J.ox,b=J.y-J.oy,m=hyp(a,b);if(m>10){mx=a/m;my=b/m}}
 if(mx||my){const m=hyp(mx,my);mv(p,mx/m*105*dt,my/m*105*dt);if(!A)ang=Math.atan2(my,mx)}
 if(A)ang=Math.atan2(A.y-p.y,A.x-p.x);
 const rng=70+g.bat*1.5;let fz=0;
 g.sh.forEach(s=>{const dx=p.x-s.x,dy=p.y-s.y,m=hyp(dx,dy);let df=Math.abs(Math.atan2(dy,dx)-ang);df=Math.min(df,6.283-df);
  s.f=m<rng&&df<.45&&(s.b?s.res<=0:1);if(s.b&&s.f){s.res=3;s.fr=.9}if(s.b)s.res-=dt;
  if(s.b&&s.fr>0){s.fr-=dt;s.f=1}else if(s.b)s.f=0;
  if(s.f){fz++}else{const v=(s.b?[78,55,50][s.type]:36+g.lv*4)*dt;mv(s,dx/m*v,dy/m*v)}
  if(m<16&&g.inv<=0){g.bat-=s.b?35:20;g.inv=.9;if(s.b)tp(s);else s.dead=1;say("The dark bites!")}});
 g.sh=g.sh.filter(s=>!s.dead);g.fz+=fz?dt:0;D.fz+=fz?dt:0;
 g.bat-=(1.1+fz*3.2)*dt;
 g.sp-=dt;if(g.sp<=0&&g.sh.length<2+g.lv){g.sp=Math.max(2,6-g.lv*.3);for(let q=0;q<30;q++){const i=1+Math.floor(Math.random()*(C-2)),j=1+Math.floor(Math.random()*(R-2)),sx=(i+.5)*T,sy=(j+.5)*T;if(!L.g[j][i]&&hyp(sx-p.x,sy-p.y)>150){g.sh.push({x:sx,y:sy,f:0});break}}}
 const b=L.boss;if(b&&b.hp>0){if(b.type==1){b.sp+=dt;if(b.sp>4){b.sp=0;g.sh.push({x:b.x,y:b.y,f:0})}}}
 if(L.sw&&!L.swOn&&hyp(L.sw.x-p.x,L.sw.y-p.y)<16){L.swOn=1;L.g[11][3]=0;say("A wall slides open somewhere...")}
 L.it=L.it.filter(o=>{if(hyp(o.x-p.x,o.y-p.y)>16)return true;
  if(o.k=="k"){L.key=1;say("Got a key")}else if(o.k=="b"){g.bat=Math.min(100,g.bat+30)}else if(o.k=="c"){g.bat=100;say("Energy crystal!")}else{L.stars++;g.score+=100;say("Star "+L.stars+"/3")}return false});
 L.tw.forEach(t=>{if(!t.on&&hyp(t.x-p.x,t.y-p.y)<20){if(t.n===L.nxt){t.on=1;L.nxt++;g.score+=50;say("Tower "+t.n+" awakens");if(L.boss&&L.boss.hp>0){L.boss.hp--;tp(L.boss);if(!L.boss.hp){g.sh=g.sh.filter(s=>!s.b);D.ach.bs=1;say("The boss dissolves!")}}}else{L.tw.forEach(u=>u.on=0);L.nxt=1;g.bat-=10;say("Wrong order. The towers dim")}}});
 if(L.nxt>L.tw.length&&(!L.boss||L.boss.hp<=0))return win();
 if(g.bat<=0){g.lives--;g.on=0;g.bat=0;setTimeout(()=>g.lives>0?ov("died"):over(),600)}}
function tp(o){for(let q=0;q<30;q++){const i=1+Math.floor(Math.random()*(C-2)),j=1+Math.floor(Math.random()*(R-2));if(!L.g[j][i]&&hyp((i+.5)*T-G.p.x,(j+.5)*T-G.p.y)>200){o.x=(i+.5)*T;o.y=(j+.5)*T;return}}}
function win(){const g=G;g.on=0;const t=Math.floor(L.t),pts=Math.max(0,300-t)+Math.floor(g.bat)*2+200;g.score+=pts;D.stars+=L.stars;
 const bt=D.bt[g.lv];const nb=!bt||t<bt;if(nb)D.bt[g.lv]=t;D.lvl=Math.max(D.lvl,g.lv+1);D.best=Math.max(D.best,g.score);
 D.ach.lit=1;if(D.stars>=10)D.ach.st=1;if(D.fz>=30)D.ach.fz=1;if(g.lv>=5)D.ach.dp=1;save();g.res={t,nb,st:L.stars,pts};ov("won")}
function over(){D.best=Math.max(D.best,G.score);save();ov("over")}
function ov(v){const o=$("#ov");o.style.display="flex";let h="";
 if(v=="menu")h=`<h1>THE LAST LIGHT</h1><p class="mu">The world is going dark. You carry the last flame.</p><p>Best ${D.best} · Stars ${D.stars}</p><button class="go" data-a="go" data-n="${D.lvl}">${D.lvl>1?"Continue: level "+D.lvl:"Begin"}</button>${D.lvl>1?`<button data-a="go" data-n="1">New game</button>`:""}<button data-a="ach">Achievements and times</button><p class="mu">Move: WASD or arrows. Aim the light: mouse.<br>Touch: drag the left half to move, tap the right half to aim.<br>Light a shadow and it freezes, but your flame burns faster. Wake the towers in number order.</p>`;
 if(v=="ach")h=`<h2>Achievements</h2>`+AC.map(a=>`<div class="it ${D.ach[a[0]]?"":"lk"}"><b>${D.ach[a[0]]?"★":"☆"} ${a[1]}</b><br><span class="mu">${a[2]}</span></div>`).join("")+`<p class="mu">Best times: ${Object.keys(D.bt).map(k=>"L"+k+" "+D.bt[k]+"s").join(", ")||"none yet"}</p><button data-a="menu">Back</button>`;
 if(v=="won")h=`<h2>Light restored</h2><p>${G.res.t}s ${G.res.nb?"(best time!)":""} · Stars ${G.res.st}/3 · +${G.res.pts}</p><p class="mu">Score ${G.score}</p><button class="go" data-a="go" data-n="${G.lv+1}" data-k="1">Next level</button><button data-a="menu">Menu</button>`;
 if(v=="died")h=`<h2>The flame went out</h2><p>Lives left: ${G.lives}</p><button class="go" data-a="go" data-n="${G.lv}" data-k="1">Try again</button>`;
 if(v=="over")h=`<h2>Darkness wins</h2><p>Score ${G.score}</p><button class="go" data-a="go" data-n="1">New game</button><button data-a="menu">Menu</button>`;
 o.innerHTML=`<div class="box">${h}</div>`}
function ring(px,py,r,a){const q=d.createRadialGradient(px,py,0,px,py,r);q.addColorStop(0,"rgba(0,0,0,"+a+")");q.addColorStop(1,"rgba(0,0,0,0)");d.fillStyle=q;d.beginPath();d.arc(px,py,r,0,6.283);d.fill()}
function draw(){const g=G,p=g.p,pl=L.pal;x.fillStyle=pl.f;x.fillRect(0,0,W,H);
 for(let j=0;j<R;j++)for(let i=0;i<C;i++){const t=L.g[j][i];if(t===1||t===3){x.fillStyle=pl.w;x.fillRect(i*T,j*T,T,T);x.fillStyle="rgba(255,255,255,.07)";x.fillRect(i*T,j*T,T,4)}else if(t===2){x.fillStyle="#8a5a2b";x.fillRect(i*T+4,j*T,T-8,T);x.fillStyle="#ffd98a";x.fillRect(i*T+13,j*T+13,6,8)}else if((i*7+j*13)%5==0){x.fillStyle=pl.a;x.globalAlpha=.5;x.beginPath();x.arc(i*T+16,j*T+16,3,0,6.283);x.fill();x.globalAlpha=1}}
 if(!L.swOn){x.fillStyle="#c9534a";x.beginPath();x.arc(L.sw.x,L.sw.y,7,0,6.283);x.fill()}
 L.it.forEach(o=>{x.fillStyle=o.k=="k"?"#ffd98a":o.k=="b"?"#7dff9a":o.k=="c"?"#7ad7ff":"#fff27a";x.shadowColor=x.fillStyle;x.shadowBlur=10;x.beginPath();if(o.k=="s")for(let a=0;a<10;a++){const r=a%2?4:9;x.lineTo(o.x+Math.cos(a*.628-1.57)*r,o.y+Math.sin(a*.628-1.57)*r)}else x.arc(o.x,o.y,o.k=="k"?6:5,0,6.283);x.fill();x.shadowBlur=0});
 L.tw.forEach(t=>{x.fillStyle=t.on?"#ffd98a":"#4a4658";x.shadowColor="#ffd98a";x.shadowBlur=t.on?18:0;x.fillRect(t.x-6,t.y-12,12,24);x.shadowBlur=0;x.fillStyle=t.on?"#1a1204":"#ddd";x.font="bold 11px Georgia";x.textAlign="center";x.fillText(t.n,t.x,t.y+4)});
 g.sh.forEach(s=>{x.fillStyle="#12081f";x.beginPath();x.arc(s.x,s.y,s.b?22:11,0,6.283);x.fill()});
 d.globalCompositeOperation="source-over";d.fillStyle="rgba(1,1,5,.97)";d.fillRect(0,0,W,H);d.globalCompositeOperation="destination-out";
 const ra=Math.max(26,85-L.t*(L.boss&&L.boss.type==2?1.4:.7)),rg=70+g.bat*1.5;
 ring(p.x,p.y,ra,.95);
 const q=d.createRadialGradient(p.x,p.y,0,p.x,p.y,rg);q.addColorStop(0,"rgba(0,0,0,1)");q.addColorStop(1,"rgba(0,0,0,0)");d.fillStyle=q;d.beginPath();d.moveTo(p.x,p.y);d.arc(p.x,p.y,rg,ang-.45,ang+.45);d.closePath();d.fill();
 L.tw.forEach(t=>{if(t.on)ring(t.x,t.y,110+Math.sin(L.t*3)*6,1)});
 x.drawImage(dk,0,0);
 g.sh.forEach(s=>{x.fillStyle=s.f?"#bfeaff":"#ff5a5a";x.shadowColor=x.fillStyle;x.shadowBlur=8;const o=s.hp?6:3;x.fillRect(s.x-o-2,s.y-3,3,3);x.fillRect(s.x+o-1,s.y-3,3,3);x.shadowBlur=0;if(s.f){x.strokeStyle="#bfeaff";x.beginPath();x.arc(s.x,s.y,s.hp?24:13,0,6.283);x.stroke()}});
 if(g.inv<=0||Math.floor(L.t*14)%2){x.fillStyle="#fff3c4";x.shadowColor="#ffd98a";x.shadowBlur=14;x.beginPath();x.arc(p.x,p.y,7,0,6.283);x.fill();x.shadowBlur=0}
 x.fillStyle="#241d10";x.fillRect(10,10,110,9);x.fillStyle=g.bat>25?"#ffd98a":"#ff5a5a";x.fillRect(10,10,110*Math.max(0,g.bat)/100,9);
 x.font="13px Georgia";x.textAlign="left";x.fillStyle="#f1e8d0";x.fillText("♥".repeat(g.lives)+"  L"+g.lv+"  ★"+L.stars+"/3",10,36);x.textAlign="right";x.fillText("Towers "+Math.min(L.nxt-1,L.tw.length)+"/"+L.tw.length+"   "+g.score,W-10,20);
 if(toastT>0){x.textAlign="center";x.font="bold 16px Georgia";x.fillStyle="#ffd98a";x.fillText(msg,W/2,H-16)}}
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(G&&L){if(G.on)step(dt);draw()}requestAnimationFrame(frame)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;if(a=="go")begin(+b.dataset.n,!b.dataset.k);else if(a)ov(a)});
addEventListener("keydown",e=>{K[e.key.length>1?e.key:e.key.toLowerCase()]=1;if(e.key.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>{K[e.key.length>1?e.key:e.key.toLowerCase()]=0});
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
cv.addEventListener("pointerdown",e=>{if(e.pointerType=="mouse")return;const q=pos(e);if(q.x<W/2)J={id:e.pointerId,ox:q.x,oy:q.y,x:q.x,y:q.y};else A=q});
cv.addEventListener("pointermove",e=>{const q=pos(e);if(e.pointerType=="mouse"){A=q;return}if(J&&J.id==e.pointerId){J.x=q.x;J.y=q.y}else if(A&&q.x>=W/2)A=q});
addEventListener("pointerup",e=>{if(J&&J.id==e.pointerId)J=null});
ov("menu");requestAnimationFrame(frame);
</script></body></html>

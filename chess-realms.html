function pzNew(){let pool=PZV.filter(p=>p[0]===PU.lv);for(let l=PU.lv;!pool.length&&l>=0;l--)pool=PZV.filter(p=>p[0]===l);if(!pool.length)pool=PZV;PU.p=pool[Math.random()*pool.length|0];PU.tries=3;PU.done=0;
 const st=fen(PU.p[2]);app(`${back()}<h2>CHESS PUZZLES</h2><div class="row">${LV.map((l,i)=>`<button class="btn ${PU.lv===i?'on':''}" data-a="pzl" data-v="${i}">${l}</button>`).join('')}</div>
 <div class="st glass" style="margin:8px 0"><div><b>${D.pz.r}</b>Puzzle rating</div><div><b id="pst">${D.pz.st}</b>PUZZLE STREAK</div><div><b>${D.pz.xp}</b>XP</div></div><div class="c"><div class="cz" id="pm">FIND THE BEST MOVE</div><small id="pt2">${PU.p[1]===1?'Mate in 1':'Mate in 2 — find the first move'} · attempts left: <span id="pa">3</span></small></div><div class="gl" style="display:flex;justify-content:center;margin:8px 0"><div id="bw"></div></div><div class="c"><button class="btn" data-a="pz">NEXT PUZZLE</button></div>`);

 else{PU.tries--;c.sel=null;draw(c);$('#pa').textContent=PU.tries;if(PU.tries<=0){PU.done=1;D.pz.st=0;D.pz.r=Math.max(400,D.pz.r-6);const s=(PU.p[1]===1?mates(c.st):m2(c.st))[0];$('#pm').innerHTML='<span class="lose">Out of attempts</span>';$('#pt2').textContent='Solution: '+san(c.st,s);$('#pst').textContent=0;save()}else toast('Not the best move — try again')}}

 const st=fen(l[2]),c={st,moves:[],sel:null,orient:'w',last:null,can:p=>{c.st.t=col(p);c.moves=legal(c.st);return 1},onMove:m=>{const n=mk(c.st,m);Object.assign(c,{st:n,last:m,sel:null,moves:[]});draw(c,{f:m.f,t:m.t});snd('move');if(!D.les[v]){D.les[v]=1;save();chAch()}}};mount($('#bw'),c)};

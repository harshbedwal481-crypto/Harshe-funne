<html lang="en"><head><meta charset="utf-8">

<style>

.pop{position:fixed;font-size:26px;z-index:99;pointer-events:none;animation:pp 1.6s ease-out forwards}
@keyframes pp{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
.ov{position:fixed;inset:0;background:#000b;z-index:150;display:none;place-items:center;padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.ov.on{display:grid}

.mb{display:flex;gap:10px;margin-top:16px}.mb button{flex:1;padding:12px}

const IT=RAW.split('\n').map(l=>{const a=l.split('|');return{c:a[0],e:a[1],n:a[2],p:+a[3]}}).sort((a,b)=>a.p-b.p).map((x,i)=>(x.i=i,x));
let Q={},bal=TOTAL,shown=TOTAL,mute=false,cat='ALL',mile={};
try{const s=JSON.parse(localStorage.getItem('shm'));if(s&&s.Q){Q=s.Q;mile=s.m||{}}}catch(e){}
const $=id=>document.getElementById(id);
const nf=(v,d=2)=>v.toLocaleString('en-IN',{maximumFractionDigits:d});

$('sum').onclick=()=>{const s=TOTAL-bal,n=Object.values(Q).reduce((a,b)=>a+b,0),own=IT.filter(x=>Q[x.i]),cs={};own.forEach(x=>cs[x.c]=(cs[x.c]||0)+Q[x.i]*x.p);

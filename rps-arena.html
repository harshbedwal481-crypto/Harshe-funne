<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPS ARENA</title>
<style>
:root{--bg:#04060f;--fg:#eaf6ff;--cy:#38e8ff;--vi:#b07cff;--go:#ffcf5a;--pn:rgba(12,18,48,.78);--ln:#2a3a7a;--a1:#050a1e;--a2:#0d1a4a;--ac:#38e8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04060f}}
:root[data-theme="dark"]{--bg:#04060f}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Bahnschrift,"Trebuchet MS",Verdana,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,var(--a2),var(--a1) 75%)}
#app::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--ac) 1px,transparent 1px) 0 0/100% 44px,linear-gradient(90deg,var(--ac) 1px,transparent 1px) 0 0/44px 100%;opacity:.05;animation:gr 8s linear infinite}
@keyframes gr{to{background-position:0 44px,44px 0}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
h1{margin:6px 0 0;font-size:clamp(34px,11vw,54px);letter-spacing:5px;text-align:center;background:linear-gradient(90deg,var(--cy),var(--vi),var(--go));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#93a6cf;margin:0 0 4px}
.mb{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 14px;border-radius:16px;border:1px solid var(--ln);background:var(--pn);text-align:left;font-size:17px;font-weight:bold}
.mb small{display:block;color:#93a6cf;font-size:12px;font-weight:normal}.mb i{font-style:normal;font-size:28px}
.mb:active{border-color:var(--cy);transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#hud{display:flex;justify-content:space-between;align-items:center;font-weight:bold;z-index:2}
#hud button{min-width:44px;min-height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--pn)}
.pl{display:flex;align-items:center;gap:10px;background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:6px 12px;z-index:2}
.pl .av{font-size:36px}.pl .nm{flex:1;line-height:1.2}.pl small{color:#93a6cf}.pl .sc{font-size:38px;font-weight:bold;color:var(--go);text-shadow:0 0 14px #ffcf5a88}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.5)}}
#tell{font-size:14px;letter-spacing:2px;min-height:18px}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:space-around;min-height:150px;z-index:1}
.hand{font-size:clamp(70px,24vw,120px);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .3s;filter:drop-shadow(0 0 16px var(--ac))}
#hL{transform:scaleX(-1)}
.pump{animation:pump .4s ease-in-out infinite}@keyframes pump{50%{margin-top:-30px}}
.clash #hL{transform:scaleX(-1) translateX(-14vw) scale(1.25)}.clash #hR{transform:translateX(-14vw) scale(1.25)}
#hL.in,#hR.in{animation:hin .5s}@keyframes hin{0%{scale:.2}60%{scale:1.4}100%{scale:1}}
.win{filter:drop-shadow(0 0 26px var(--go))!important}.lose{opacity:.35}
#vs{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:14px;letter-spacing:4px;color:#93a6cf}
#cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(50px,18vw,90px);font-weight:bold;color:var(--fg);text-shadow:0 0 30px var(--cy);pointer-events:none;z-index:3}
#cnt.b{animation:pop .4s}
#res{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:clamp(34px,11vw,54px);font-weight:bold;pointer-events:none;z-index:3;animation:pop .6s}
#ban{text-align:center;min-height:26px;font-weight:bold;letter-spacing:3px;color:var(--go);z-index:2}
#tw{height:8px;border-radius:4px;background:#16204a;overflow:hidden;z-index:2}#tb{height:100%;width:100%;background:linear-gradient(90deg,var(--cy),var(--vi))}
#btns{display:flex;gap:8px;z-index:2}
.rb{flex:1;min-height:116px;border-radius:20px;border:2px solid var(--ln);background:linear-gradient(180deg,#10194a,#070d28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font-weight:bold;letter-spacing:2px;font-size:13px;opacity:.5;transition:transform .15s,opacity .2s}
.rb .ic{font-size:clamp(44px,14vw,62px)}
.rb.rdy{opacity:1;border-color:var(--cy);box-shadow:0 0 18px #38e8ff44;animation:bob 1.6s ease-in-out infinite}.rb.rdy:nth-child(2){animation-delay:.2s}.rb.rdy:nth-child(3){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-5px)}}
.rb.rdy:active{transform:scale(.93);border-color:var(--go)}.rb[disabled]{opacity:.2!important;animation:none}
.rb .st{position:absolute;top:4px;right:8px;font-size:20px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
#ov{position:absolute;inset:0;z-index:20;background:rgba(3,5,16,.9);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:14px}
#pn{width:100%;max-width:440px}
#pn h2{margin:8px 0;letter-spacing:2px}#pn p{color:#93a6cf}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.tabs button{flex:0 0 auto;padding:8px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--pn)}.tabs .a{border-color:var(--go);color:var(--go)}
.it{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--ln);border-radius:14px;margin:6px 0;background:var(--pn)}.it .pv{font-size:28px;min-width:64px;text-align:center}.it .in{flex:1}.it small{color:#93a6cf;display:block}
.btn{min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--cy);background:transparent}.btn.p{background:linear-gradient(90deg,var(--cy),var(--vi));color:#02061a;border:0;font-weight:bold}.btn[disabled]{opacity:.4}
.shake{animation:shk .4s}@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,3px)}}
body.rm *{animation:none!important;transition:none!important}
</style></head><body>
<div id="app">
<div id="menu" class="scr"><h1>RPS ARENA</h1><p class="sub">Read your rival. Win the clash.</p>
<div id="mstat" class="sub"></div>
<button class="mb" data-m="quick"><i>⚡</i><div>Quick Match<small>First to 3 wins</small></div></button>
<button class="mb" data-m="bo10"><i>🔟</i><div>Best of 10<small>Most points after 10 rounds</small></div></button>
<button class="mb" data-m="endless"><i>♾️</i><div>Endless<small>Keep winning until you lose</small></div></button>
<button class="mb" data-m="tourn"><i>🏆</i><div>Tournament<small>Beat five champions</small></div></button>
<button class="mb" data-m="chal"><i>🎯</i><div>Challenge<small>Special rules, big rewards</small></div></button>
<button class="mb" data-m="two"><i>👥</i><div>2 Player<small>Pass the device</small></div></button>
<div class="grid2"><button class="mb" data-m="shop"><i>🛒</i><div>Shop</div></button><button class="mb" data-m="set"><i>⚙️</i><div>Settings</div></button></div></div>
<div id="game" class="scr" hidden>
<div id="hud"><button id="bk" aria-label="Menu">✕</button><span id="hr"></span><span id="hs"></span><span id="hc"></span></div>
<div class="pl" id="po"><div class="av" id="oa"></div><div class="nm"><b id="on"></b><br><small id="od"></small><div id="tell"></div></div><div class="sc" id="so">0</div></div>
<div id="stage"><div class="hand" id="hL">✊</div><div id="vs">VS</div><div class="hand" id="hR">✊</div><div id="cnt"></div><div id="res"></div></div>
<div id="ban"></div><div id="tw"><div id="tb"></div></div>
<div class="pl" id="pu"><div class="av" id="pa"></div><div class="nm"><b id="pn2">YOU</b><br><small id="pt"></small></div><div class="sc" id="sp">0</div></div>
<div id="btns"></div></div>
<div id="ov"><div id="pn"></div></div></div>
<canvas id="fx"></canvas>
<script>
const $=id=>document.getElementById(id);
const OPP=[{n:'Pip',e:'🐣',lv:1,k:'Rookie',arena:'Training Yard',a1:'#04120c',a2:'#0d3a28',ac:'#5dff9d',d:'Loves rock. Very predictable.'},{n:'Dizzy',e:'🎲',lv:2,k:'Random',arena:'Casino Void',a1:'#12041e',a2:'#3a0b52',ac:'#ff4dd8',d:'Pure chaos. No pattern to read.'},{n:'Vex',e:'🦊',lv:3,k:'Smart',arena:'Neon Grid',a1:'#031428',a2:'#0a3a5a',ac:'#38e8ff',d:'Counts your favourite move.'},{n:'Sensei Null',e:'🧙',lv:4,k:'Master',arena:'Sky Temple',a1:'#1a1204',a2:'#4a3608',ac:'#ffcf5a',d:'Predicts your next move from patterns.'},{n:'OMNI',e:'👁️',lv:5,k:'Impossible',arena:'Singularity',a1:'#0a0010',a2:'#3a0a30',ac:'#ff3b5c',d:'Peeks at your move 40% of the time.'}];
const SPN={double:'⚡ DOUBLE ROUND · 2 pts',mystery:'🎭 MYSTERY ROUND',speed:'⏱️ SPEED ROUND · 2s',chaos:'🌪️ CHAOS ROUND · ⭐ +1'};
const CHAL=[{id:'norock',n:'No Rock',e:'🚫',d:'Rock is banned for you. First to 3 vs Vex.',opp:2,tgt:3,r:80,norock:1},{id:'ties',n:'Ties Hurt',e:'💔',d:'Every draw gives your rival a point. First to 5 vs Dizzy.',opp:1,tgt:5,r:100,ties:1},{id:'speed',n:'Speed Demon',e:'⏱️',d:'Every round is a speed round. First to 5 vs Vex.',opp:2,tgt:5,r:120,force:'speed'},{id:'chaos',n:'Chaos Storm',e:'🌪️',d:'Every round is chaos. First to 5 vs Sensei Null.',opp:3,tgt:5,r:160,force:'chaos'},{id:'mind',n:'Mind Reader',e:'🎭',d:'Every round is a mystery vs OMNI. First to 3.',opp:4,tgt:3,r:300,force:'mystery'}];
const SHOP={hands:{n:'Hands',l:[['classic','Classic',0,['🪨','📄','✂️']],['fist','Fists',40,['✊','✋','✌️']],['cyber','Ancient',90,['🗿','📜','🗡️']],['cosmic','Cosmic',150,['☄️','🌌','⚡']],['arcade','Arcade',220,['👾','🕹️','💥']]]},
fx:{n:'Clash FX',l:[['spark','Spark',0,['#38e8ff','#ffffff']],['plasma','Plasma',60,['#b07cff','#ff4dd8']],['gold','Gold burst',120,['#ffcf5a','#fff3b0']],['inferno','Inferno',180,['#ff5a2a','#ffcf5a']]]},
av:{n:'Avatars',l:[['a0','Cool',0,['😎']],['a1','Robot',30,['🤖']],['a2','Lion',60,['🦁']],['a3','Dragon',100,['🐉']],['a4','Crown',160,['👑']]]},
vic:{n:'Victory',l:[['confetti','Confetti',0,['🎊']],['fireworks','Fireworks',80,['🎆']],['lightning','Lightning',140,['⚡']],['stars','Starfall',200,['🌟']]]},
snd:{n:'Sounds',l:[['arcade','Arcade',0,['🕹️']],['scifi','Sci-Fi',70,['🛸']],['retro','Retro',130,['📼']]]},
bg:{n:'Arenas',l:[['neon','Neon Deck',0,['#050a1e','#0d1a4a','#38e8ff']],['sunset','Sunset Ring',50,['#1a0710','#4a1430','#ff8a5a']],['void','Void Pit',100,['#03030a','#1a1030','#b07cff']],['matrix','Matrix Dojo',160,['#020e06','#0a3a18','#5dff9d']]]}};
let sv={coins:0,wins:0,matches:0,best:0,endless:0,tourn:0,chal:{},own:{classic:1,spark:1,a0:1,confetti:1,arcade:1,neon:1},eq:{hands:'classic',fx:'spark',av:'a0',vic:'confetti',snd:'arcade',bg:'neon'},sound:1,rm:0};
try{const s=JSON.parse(localStorage.getItem('rpsarena')||'null');if(s)sv=Object.assign(sv,s,{own:Object.assign(sv.own,s.own||{}),eq:Object.assign(sv.eq,s.eq||{}),chal:s.chal||{}})}catch(e){}
const save=()=>{try{localStorage.setItem('rpsarena',JSON.stringify(sv))}catch(e){}};
if(matchMedia('(prefers-reduced-motion: reduce)').matches&&!sv.rmSet)sv.rm=1;
const sleep=ms=>new Promise(r=>setTimeout(r,sv.rm?ms/3:ms));
const eqd=c=>SHOP[c].l.find(i=>i[0]===sv.eq[c])[3];
const NM=['ROCK','PAPER','SCISSORS'];
let G=null,pickFn=null,abort=0,AC;
// ---------- audio
function tone(f,d,ty,v,f2,dl){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(dl||0);o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function sfx(k){if(!sv.sound)return;const p=sv.eq.snd,ty=p==='scifi'?'sawtooth':p==='retro'?'triangle':'square',m=p==='retro'?.6:1;
 if(k==='tick')tone(500*m,.09,ty);else if(k==='rev')tone(120*m,.35,ty,.1,40);else if(k==='win')[523,659,784,1047].forEach((f,i)=>tone(f*m,.25,ty,.08,0,i*.09));
 else if(k==='lose')[330,262,196].forEach((f,i)=>tone(f*m,.3,ty,.08,0,i*.12));else if(k==='draw')tone(300*m,.2,ty);else if(k==='coin')tone(1200,.1,'sine',.06);else tone(700*m,.06,ty,.05)}
// ---------- particles
const fc=$('fx'),fx=fc.getContext('2d');let PT=[],pr=0;
function fit(){fc.width=innerWidth;fc.height=innerHeight}addEventListener('resize',fit);fit();
function burst(x,y,n,cols,sp,g){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(sp||6)*(.3+Math.random());PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:40+Math.random()*30,c:cols[i%cols.length],g:g||.15,s:2+Math.random()*4})}if(!pr){pr=1;requestAnimationFrame(pLoop)}}
function pLoop(){fx.clearRect(0,0,fc.width,fc.height);for(const p of PT){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;fx.globalAlpha=Math.min(1,p.l/25);fx.fillStyle=p.c;fx.fillRect(p.x,p.y,p.s,p.s)}fx.globalAlpha=1;PT=PT.filter(p=>p.l>0);if(PT.length)requestAnimationFrame(pLoop);else pr=0}
function stageXY(){const r=$('stage').getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function victory(){const t=sv.eq.vic,W=innerWidth,cols=['#38e8ff','#b07cff','#ffcf5a','#ff4dd8','#fff'];let n=0;const iv=setInterval(()=>{n++;if(t==='confetti')burst(Math.random()*W,-10,14,cols,3,.12);else if(t==='fireworks')burst(W*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4),34,cols,7,.08);else if(t==='lightning'){burst(W*Math.random(),0,18,['#fff','#38e8ff'],9,.4);$('app').classList.add('shake');setTimeout(()=>$('app').classList.remove('shake'),300)}else burst(Math.random()*W,innerHeight,12,['#ffcf5a','#fff'],3,-.12);if(n>14)clearInterval(iv)},140)}
// ---------- AI
const cnt=m=>(m+1)%3;
function aiMove(o,hist,pm){const r=Math.random(),rnd=()=>Math.floor(Math.random()*3),k=o.k;
 const freq=()=>{const c=[0,0,0];hist.forEach(m=>{if(m>=0)c[m]++});return c.indexOf(Math.max(...c))};
 const markov=()=>{if(hist.length<3)return freq();const a=hist[hist.length-2],b=hist[hist.length-1],c=[0,0,0];for(let i=2;i<hist.length;i++)if(hist[i-2]===a&&hist[i-1]===b)c[hist[i]]++;const s=c[0]+c[1]+c[2];return s?c.indexOf(Math.max(...c)):freq()};
 if(k==='Rookie')return r<.5?0:rnd();if(k==='Random')return rnd();
 if(k==='Smart'){if(hist.length<2)return rnd();return r<.6?cnt(freq()):r<.75?cnt(hist[hist.length-1]):rnd()}
 if(k==='Master')return r<.8?cnt(markov()):rnd();
 return r<.4&&pm>=0?cnt(pm):(r<.9?cnt(markov()):rnd())}
// ---------- UI
function show(id){['menu','game'].forEach(s=>$(s).hidden=s!==id);$('ov').style.display='none'}
function ov(h){$('pn').innerHTML=h;$('ov').style.display='flex'}const closeOv=()=>{$('ov').style.display='none'};
function menu(){abort++;G=null;show('menu');applyBG(null);$('mstat').innerHTML='🪙 <b style="color:var(--go)">'+sv.coins+'</b> · 🏆 '+sv.wins+' wins · 🔥 best streak '+sv.best}
function applyBG(o){const b=SHOP.bg.l.find(i=>i[0]===sv.eq.bg)[3],s=document.documentElement.style;if(o){s.setProperty('--a1',o.a1);s.setProperty('--a2',o.a2);s.setProperty('--ac',o.ac)}else{s.setProperty('--a1',b[0]);s.setProperty('--a2',b[1]);s.setProperty('--ac',b[2])}}
function ui(){const g=G;$('so').textContent=g.sc.o;$('sp').textContent=g.sc.p;$('hc').textContent='🪙 '+sv.coins;$('hs').textContent='🔥 '+g.streak;
 $('hr').textContent='ROUND '+g.round+(g.mode==='bo10'?' / 10':'')+' · '+(g.tgt?'first to '+g.tgt:g.mode==='endless'?'endless':'')}
function setOpp(){const o=G.opp;$('oa').textContent=o.e;$('on').textContent=o.n;$('od').textContent=G.two?'Player 2':'★'.repeat(o.lv)+' '+o.k+' · '+o.arena;applyBG(G.two?null:o);$('pa').textContent=eqd('av')[0];$('pn2').textContent=G.two?'PLAYER 1':'YOU';$('pt').textContent=''}
function tell(sp){$('tell').textContent=G.two?'':sp==='mystery'?'🎭 ? ? ? ? ?':G.oh.slice(-5).map(m=>m<0?'·':eqd('hands')[m]).join(' ')}
function btns(sp,who){const H=eqd('hands');let ord=[0,1,2];if(sp==='chaos'){ord.sort(()=>Math.random()-.5);G.star=Math.floor(Math.random()*3)}
 $('btns').innerHTML=ord.map(m=>'<button class="rb" data-m="'+m+'" aria-label="'+NM[m]+'"'+(G.chal&&G.chal.norock&&m===0?' disabled':'')+'><span class="ic">'+H[m]+'</span>'+NM[m]+(sp==='chaos'&&m===G.star?'<span class="st">⭐</span>':'')+'</button>').join('')}
function enable(on){document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('rdy',on&&!b.disabled))}
function choose(sp){return new Promise(res=>{const lim=sp==='speed'?2000:10000,t0=performance.now();let done=0,iv,to;const fin=v=>{if(done)return;done=1;clearInterval(iv);clearTimeout(to);enable(false);pickFn=null;res(v)};pickFn=fin;enable(true);$('pt').textContent=G.two?G.who:'Choose!';
 iv=setInterval(()=>{const p=Math.max(0,1-(performance.now()-t0)/lim);$('tb').style.width=p*100+'%'},50);to=setTimeout(()=>fin(sp==='speed'?-1:Math.floor(Math.random()*3)),lim)})}
$('btns').addEventListener('click',e=>{const b=e.target.closest('.rb');if(b&&pickFn&&!b.disabled){sfx('click');pickFn(+b.dataset.m)}});
function passScreen(t){return new Promise(r=>{ov('<h2>'+t+'</h2><p>Hand the device over. Don\'t peek!</p><button class="btn p" id="rdy">I\'M READY</button>');$('rdy').onclick=()=>{closeOv();r()}})}
// ---------- rounds
function special(){const g=G;if(g.chal&&g.chal.force)return g.chal.force;if(g.round<2||Math.random()>.28)return '';const l=g.two?['double','speed','chaos']:['double','mystery','speed','chaos'];return l[Math.floor(Math.random()*l.length)]}
const res=(a,b)=>a===b?0:a<0?-1:b<0?1:a===(b+1)%3?1:-1;
async function playRound(){const g=G,my=abort;g.sp=special();const sp=g.sp;
 $('res').textContent='';$('cnt').textContent='';$('hL').textContent='✊';$('hR').textContent=sp==='mystery'?'🎭':'✊';$('hL').className=$('hR').className='hand pump';$('stage').classList.remove('clash');
 $('ban').textContent=sp?SPN[sp]:'ROUND '+g.round;ui();tell(sp);btns(sp);if(sp)sfx('draw');await sleep(sp?1100:600);if(my!==abort)return;
 let a,b;
 if(g.two){g.who='PLAYER 1';await passScreen('PLAYER 1');a=await choose(sp);g.who='PLAYER 2';btns(sp);$('pn2').textContent='PLAYER 2';await passScreen('PLAYER 2');b=await choose(sp);$('pn2').textContent='PLAYER 1'}
 else{a=await choose(sp);b=aiMove(g.opp,g.hist,a)}
 if(my!==abort)return;
 g.hist.push(a);g.oh.push(b);$('tb').style.width='100%';$('pt').textContent='';
 for(const c of['3','2','1']){$('cnt').className='b';$('cnt').textContent=c;sfx('tick');await sleep(sp==='speed'?280:480);$('cnt').className=''}
 $('cnt').textContent='REVEAL!';sfx('rev');await sleep(300);if(my!==abort)return;$('cnt').textContent='';

async function runMatch(){const my=abort;for(;;){const r=await playRound();if(my!==abort)return;if(r==='end')break}finish()}
function newMatch(opp,o){G=Object.assign({opp,sc:{p:0,o:0},round:1,hist:[],oh:[],streak:0,best:0,rw:0,star:0,coins:0,tgt:3},o||{},{opp});show('game');setOpp();ui();runMatch()}

 ov('<div style="text-align:center"><h2 style="font-size:34px;color:'+(w?'var(--go)':'#ff5c7a')+'">'+title+'</h2><p style="font-size:24px;color:var(--fg)">'+g.sc.p+' – '+g.sc.o+'</p>'+more+(coins?'<p>+<b style="color:var(--go)">'+coins+'</b> 🪙 Arena Coins</p>':'')+'<button class="btn p" id="rm" style="width:100%;margin:6px 0">REMATCH</button><button class="btn" id="mn" style="width:100%">MENU</button></div>');

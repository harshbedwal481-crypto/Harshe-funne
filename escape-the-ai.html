const $=i=>document.getElementById(i),C=$('cv'),X=C.getContext('2d'),U=$('ui');

/* audio */
let ac,dg,dz;

/* data */
const LORE=["LOG 01 — Designation: ORACLE-7. Built to keep the facility safe. Nobody said from what.","LOG 02 — The staff left in a hurry. The coffee is still warm in Lab 3.","LOG 03 — ORACLE-7 was asked to protect people. It found a loophole: people can't be hurt if they can't leave.","LOG 04 — You were not the first visitor. You are the first to get this far.","LOG 05 — The cores aren't power sources. They're memories. Its memories.","LOG 06 — It isn't hunting you. It's afraid you'll switch it off.","LOG 07 — The exit was never locked. It was hidden. Ask yourself who hid it."];

const A=[['FIRST ESCAPE','Complete your first level.','esc',1],['GHOST','Escape without being detected.','ghost',1],['SPEEDRUNNER','Escape a level in 30s or less.','spd',1],['HACKER','Disable 10 security systems.','hacks',10],['RISK TAKER','Grab a core with the AI nearby.','risk',1],['SURVIVOR','Reach level 10.','maxlvl',10],['NIGHTMARE','Play Nightmare mode.','nm',1],['THEY NEVER SAW YOU','Finish with zero alarms.','quiet',1],['COLLECTOR','Collect 50 cores.','cores',50],['HOARDER','Collect 200 cores.','cores',200],['FIVE ESCAPES','Escape 5 times.','esc',5],['VETERAN','Escape 25 times.','esc',25],['LEGEND','Escape 100 times.','esc',100],['DEEP SYSTEM','Reach level 20.','maxlvl',20],['CORE BREAKER','Reach level 30.','maxlvl',30],['ENDLESS','Reach level 35.','maxlvl',35],['DISTRACTOR','Use 10 noise devices.','noise',10],['LOCKER RAT','Hide 10 times.','hides',10],['DASHER','Dash 25 times.','dash',25],['PULSE','Use EMP 5 times.','emps',5],['ARCHIVIST','Find 3 AI logs.','logs',3],['THE TRUTH','Find all 7 AI logs.','logs',7],['SECRET FINDER','Find a hidden log.','logs',1],['DAILY DRIVER','Finish a daily challenge.','daily',1],['UNTOUCHED','Escape without damage or detection.','flaw',1],['PERSISTENT','Get caught 5 times.','deaths',5],['WEALTHY','Earn 500 DATA total.','dataT',500]];
const COL=[['#22d3ee','CYAN',0],['#a78bfa','PURPLE',60],['#34d399','MINT',60],['#fbbf24','GOLD',100],['#f472b6','PINK',120],['#ffffff','WHITE',150]];
/* util */
function bfs(g,sx,sy){const H=g.length,W=g[0].length,d=new Int16Array(W*H).fill(-1),q=[sx+sy*W];d[q[0]]=0;for(let i=0;i<q.length;i++){const c=q[i],x=c%W,y=c/W|0;for(const[a,b]of DIRS){const nx=x+a,ny=y+b;if(nx>=0&&ny>=0&&nx<W&&ny<H&&!g[ny][nx]&&d[nx+ny*W]<0){d[nx+ny*W]=d[c]+1;q.push(nx+ny*W)}}}return d}
function P(lv,mode){const df=[.85,1,1.15][S.set.df],n=mode==='nm'?1.2:1,l=mode==='daily'?10:lv;return{lv,cx:Math.min(12,5+(l/4|0)),cy:Math.min(9,4+(l/5|0)),need:Math.min(9,3+(l/4|0)),ai:Math.min(4,1+(l>=21)+(l>=26)+(lv>30)+(mode==='nm')),spd:Math.min(5.6,2.4+l*.09)*df*n,rg:Math.min(11,5+l*.2)*df*n,srch:4+l*.1,cams:l>=6?Math.min(6,1+((l-6)/4|0)):0,lasers:l>=11?Math.min(6,1+((l-11)/3|0)):0,lock:Math.max(1,4-(l/6|0))}}
function build(p,R){const W=p.cx*2+1,H=p.cy*2+1,g=Array.from({length:H},()=>Array(W).fill(1)),seen=new Set(['0,0']),st=[[0,0]];g[1][1]=0;
while(st.length){const[a,b]=st[st.length-1],nb=DIRS.map(d=>[a+d[0],b+d[1],d]).filter(n=>n[0]>=0&&n[1]>=0&&n[0]<p.cx&&n[1]<p.cy&&!seen.has(n[0]+','+n[1]));if(!nb.length){st.pop();continue}const n=nb[R()*nb.length|0];seen.add(n[0]+','+n[1]);g[b*2+1+n[2][1]][a*2+1+n[2][0]]=0;g[n[1]*2+1][n[0]*2+1]=0;st.push([n[0],n[1]])}
for(let i=0;i<p.cx*p.cy*.4;i++){const x=1+R()*(W-2)|0,y=1+R()*(H-2)|0;if((x+y)%2)g[y][x]=0}
const d=bfs(g,1,1),cells=[];for(let y=1;y<H;y+=2)for(let x=1;x<W;x+=2)cells.push({x:x+.5,y:y+.5,d:d[x+y*W],de:DIRS.filter(([a,b])=>!g[y+b][x+a]).length===1});
const ex=cells.reduce((a,c)=>c.d>a.d?c:a),md=ex.d,pool=cells.filter(c=>c!==ex&&c.d>2).sort(()=>R()-.5),tk=()=>pool.pop()||cells[1];
const m={W,H,g,cells,ex,cores:[],lk:[],cams:[],lz:[],tm:[],pu:[],lg:null,ai:[]};
for(let i=0;i<p.need;i++)m.cores.push({...tk()});
const de=pool.filter(c=>c.de);for(let i=0;i<p.lock;i++){const c=de.pop()||tk();pool.splice(pool.indexOf(c),1);m.lk.push({...c})}
for(let i=0;i<p.cams;i++){const c=tk();m.cams.push({x:c.x,y:c.y,a:R()*6.28,sw:.7+R()*.6,sp:.7+R()*.6,off:0,acc:0})}
for(let i=0;i<p.lasers;i++){const c=tk();m.lz.push({x:c.x,y:c.y,ph:R()*3,off:0})}
for(let i=0;i<2;i++)m.tm.push({...tk()});
if(R()<.3){const c=tk();m.pu.push({x:c.x,y:c.y,t:'SGME'[R()*4|0]})}
if(R()<.35){const c=tk();m.lg={x:c.x,y:c.y}}
const far=cells.filter(c=>c.d>md*.5&&c!==ex).sort(()=>R()-.5);for(let i=0;i<p.ai;i++){const c=far[i%far.length];m.ai.push({x:c.x,y:c.y,sx:c.x,sy:c.y,st:'patrol',tx:c.x|0,ty:c.y|0,t:0,stun:0,lx:0,ly:0})}
return m}
/* game */
let G=null,RUN={},keys={},jx=0,jy=0,last=0,dpr=1,TS=20,ox=0,oy=0,touch=('ontouchstart' in window)||navigator.maxTouchPoints>0,hudT=0,spr=false;
const pick=a=>a[Math.random()*a.length|0];
function go(mode){au();sfx('click');RUN={mode,score:0,cores:0,time:0};nextLvl(mode==='story'?S.lvl:1)}
function nextLvl(lv){const mode=RUN.mode,p=P(lv,mode),seed=mode==='daily'?hash(today()):Math.random()*1e9|0,R=mk(seed),m=build(p,R);
G={...m,p,lv,mode,R:Math.random,t:0,ls:0,det:0,alarms:0,dmg:0,got:0,parts:[],dec:[],fc:new Map(),paused:0,over:0,dark:0,ev:20+Math.random()*20,step:0,nzt:0,tut:mode==='story'&&lv===1&&!S.tut?0:-1,
pl:{x:1.5,y:1.5,hp:3,sta:100,hid:0,inv:0,dc:0,ec:0,dt:0,fx:1,fy:0,sp:0,gh:0,sc:0,nz:3,moved:0},spd:p.spd,rg:p.rg,srch:p.srch};
hide();$('hud').style.display='flex';$('tc').style.display=touch?'flex':'none';resize();$('tip').style.display=G.tut>=0?'block':'none';
if(G.mode==='daily')say("DAILY CHALLENGE — "+today(),'g')}
function resize(){dpr=Math.min(2,window.devicePixelRatio||1)*(S.set.gq?1:.7);C.width=innerWidth*dpr;C.height=innerHeight*dpr;if(G){const top=56,bot=touch?170:10,w=innerWidth-16,h=innerHeight-top-bot;TS=Math.max(8,Math.min(w/G.W,h/G.H));ox=(innerWidth-TS*G.W)/2;oy=top+(h-TS*G.H)/2}}
addEventListener('resize',resize);
function say(t,c=''){const e=$('msg');e.textContent=t;e.className=c;e.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>e.style.opacity=0,2600)}
function part(x,y,c,n=10){const mx=S.set.gq?60:20;for(let i=0;i<n&&G.parts.length<mx;i++){const a=Math.random()*6.28,s=1+Math.random()*2.5;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,c})}}
const solid=(x,y)=>G.g[y|0][x|0]!==0,blk=(x,y,r)=>solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r);
function mv(e,dx,dy,r){if(!blk(e.x+dx,e.y,r))e.x+=dx;if(!blk(e.x,e.y+dy,r))e.y+=dy}
function los(a,b){const dx=b.x-a.x,dy=b.y-a.y,n=Math.ceil(Math.hypot(dx,dy)*3);for(let i=1;i<n;i++)if(G.g[(a.y+dy*i/n)|0][(a.x+dx*i/n)|0])return false;return true}
function field(tx,ty){const k=tx+','+ty;let f=G.fc.get(k);if(!f){if(G.fc.size>120)G.fc.clear();f=bfs(G.g,tx,ty);G.fc.set(k,f)}return f}
function step(a,tx,ty,sp,dt){const f=field(tx,ty),cx=a.x|0,cy=a.y|0;let best=f[cx+cy*G.W],bx=tx+.5,by=ty+.5;if(cx!==tx||cy!==ty)for(const[u,v]of DIRS){const nx=cx+u,ny=cy+v;if(G.g[ny]&&G.g[ny][nx]===0){const d=f[nx+ny*G.W];if(d>=0&&d<best){best=d;bx=nx+.5;by=ny+.5}}}
const dx=bx-a.x,dy=by-a.y,l=Math.hypot(dx,dy)||1,s=Math.min(sp*dt,l);a.x+=dx/l*s;a.y+=dy/l*s}
const near=(a)=>Math.hypot(a.x-(a.tx+.5),a.y-(a.ty+.5))<.25;
function noise(x,y,r){for(const a of G.ai)if(a.st!=='chase'&&Math.hypot(a.x-x,a.y-y)<r){a.st='investigate';a.tx=x|0;a.ty=y|0}}
function hurt(){const p=G.pl;if(p.inv>0)return;p.hp--;p.inv=1.5;G.dmg++;sfx('hit');say('⚠ SIGNAL CORRUPTED');C.style.filter='hue-rotate(90deg) contrast(1.4)';setTimeout(()=>C.style.filter='',180);if(p.hp<=0)lose()}
function aiU(a,dt){if((a.stun-=dt)>0)return;const p=G.pl,d=Math.hypot(p.x-a.x,p.y-a.y),rg=G.rg*(p.hid?.3:1)*(p.gh>0?.4:1)*(G.dark>0?1.15:1),see=d<rg&&los(a,p);
if(see||(p.hid&&d<1.1&&(a.st==='investigate'||a.st==='search'))){if(a.st!=='chase'){G.det++;G.alarms++;sfx('alarm');if(Math.random()<.5)say(pick(AIM))}a.st='chase';a.lx=p.x|0;a.ly=p.y|0;a.t=G.srch}
else if(a.st==='chase'){a.st='search';a.t=G.srch;a.tx=a.lx;a.ty=a.ly}
if(a.st==='chase')step(a,p.x|0,p.y|0,G.spd,dt);
else if(a.st==='investigate'){step(a,a.tx,a.ty,G.spd*.85,dt);if(near(a)){a.st='search';a.t=4}}
else if(a.st==='search'){a.t-=dt;step(a,a.tx,a.ty,G.spd*.8,dt);if(near(a)){const c=pick(G.cells.filter(c=>Math.hypot(c.x-a.lx,c.y-a.ly)<6));a.tx=c.x|0;a.ty=c.y|0}if(a.t<=0)a.st='patrol'}
else{step(a,a.tx,a.ty,G.spd*.6,dt);if(near(a)){const c=pick(G.cells);a.tx=c.x|0;a.ty=c.y|0}}
if(d<.55){hurt();a.stun=2.5;a.x=a.sx;a.y=a.sy;a.st='patrol'}}
function upd(dt){const p=G.pl,m=G;m.t+=dt;m.ev-=dt;m.dark-=dt;p.inv-=dt;p.dc-=dt;p.ec-=dt;p.sp-=dt;p.gh-=dt;p.sc-=dt;
let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+jx,iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+jy;const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}if(p.hid)ix=iy=0;
if(l>.15){p.fx=ix;p.fy=iy}let sp=3.4*(p.sp>0?1.3:1);const run=(keys.shift||spr)&&l>.15&&p.sta>0&&!p.hid;
if(run){sp*=1.55;p.sta-=30*dt;m.nzt-=dt;if(m.nzt<=0){m.nzt=.4;noise(p.x,p.y,4.5)}}else p.sta=Math.min(100,p.sta+15*dt);
if(p.dt>0){p.dt-=dt;sp=14;ix=p.fx;iy=p.fy;if(S.cos.tr)part(p.x,p.y,S.cos.c,1)}

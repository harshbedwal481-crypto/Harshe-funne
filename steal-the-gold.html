</style></head><body>
<div id="app"><canvas id="c" width="360" height="520"></canvas><button id="jam">JAM</button></div>
<div id="ov"><div id="pn"></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d'),W=360,H=520;
const LOC=[['🏦','BANK','#22d3c5'],['💎','JEWELRY STORE','#ff5cae'],['🏛️','MUSEUM','#ffb347'],['🏢','MANSION','#b07cff'],['🚆','ARMORED TRAIN','#9fb4c8'],['🏝️','ISLAND VAULT','#3ddc97'],['🏙️','SKYSCRAPER','#5aa8ff'],['🚀','SPACE STATION','#a78bfa']];
const UP=[['speed','🏃','Faster movement','+8% speed'],['lock','🔧','Faster lockpicking','vault opens faster'],['bag','🎒','Bigger loot bag','+3 slots'],['stealth','🥷','Stealth duration','detection fills slower'],['disguise','🎭','Better disguise','−8% guard vision'],['jam','📡','Security jammer','+1 charge per heist'],['veh','🚗','Getaway vehicle','+12% payout']];
const VEH=['🛵','🚗','🚙','🏎️','🚁','🚀'],EVN=['⚡ POWER OUTAGE','🚨 EXTRA SECURITY','🔓 VAULT UNLOCKED','👮 GUARD PATROL CHANGED','👀 SECRET ROOM FOUND','💰💰 DOUBLE LOOT'];
let sv={cash:0,lv:1,up:{speed:0,lock:0,bag:0,stealth:0,disguise:0,jam:0,veh:0},best:{},bt:{},end:0,daily:{}};
try{const s=JSON.parse(localStorage.getItem('stg')||'null');if(s)sv=Object.assign(sv,s,{up:Object.assign(sv.up,s.up||{})})}catch(e){}
function save(){try{localStorage.setItem('stg',JSON.stringify(sv))}catch(e){}}
let EX=[34,60],S='menu',sel=1,mode='camp',lv=1,seed=1,end=1,bank=0,L,walls,guards,cams,lasers,sens,drones,loot,door,P,T,carry,wt,det,heat,alarm,outage,jamT,jams,dbl,pick,ext,evs,over,pa,pp,msg='',msgT=0,sh=0,touch={a:0},K={l:0,r:0,u:0,d:0},AC,R2,dwarn=0;
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let b=Math.imul(a^a>>>15,1|a);b=b+Math.imul(b^b>>>7,61|b)^b;return((b^b>>>14)>>>0)/4294967296}}
function snd(f,d,ty,v){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=v||.04;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const say=m=>{msg=m;msgT=110};
const $$=n=>'$'+Math.round(n).toLocaleString('en-US');
const cl=(n,a,b)=>Math.max(a,Math.min(b,n));
function blocked(px,py,r){for(const w of walls){const cx=cl(px,w[0],w[0]+w[2]),cy=cl(py,w[1],w[1]+w[3]);if(Math.hypot(px-cx,py-cy)<r)return true}return false}
function los(ax,ay,bx,by){const n=Math.ceil(Math.hypot(bx-ax,by-ay)/6);for(let i=1;i<n;i++){const px=ax+(bx-ax)*i/n,py=ay+(by-ay)*i/n;for(const w of walls)if(px>w[0]&&px<w[0]+w[2]&&py>w[1]&&py<w[1]+w[3])return false}return true}
function burst(a,b,n,c){for(let i=0;i<n;i++){const an=Math.random()*6.28,s=1+Math.random()*3;pa.push({x:a,y:b,vx:Math.cos(an)*s,vy:Math.sin(an)*s,l:25,c})}}
function gen(lv,seed){
 const R=mul(seed);R2=mul(seed+99);EX=[[40,70],[W-40,H-40],[W-40,300]][Math.floor(R()*3)];const diff={g:Math.min(6,1+Math.floor(lv/4)),c:Math.min(5,Math.floor(lv/3)),l:Math.min(5,Math.floor(lv/4)),s:lv>=4?Math.min(4,Math.floor((lv-2)/4)):0,d:lv>=6?Math.min(3,Math.floor((lv-2)/6)):0};
 walls=[[0,0,W,8],[0,H-8,W,8],[0,0,8,H],[W-8,0,8,H],[240,40,8,118],[240,40,112,8],[240,150,40,8],[312,150,40,8]];door=[280,150,32,8,1];walls.push(door);
 const nw=Math.min(12,5+Math.floor(lv/3));
 for(let k=0,t=0;k<nw&&t<80;t++){const h=R()<.5,len=60+R()*70,wx=20+R()*(W-40-(h?len:10)),wy=60+R()*(H-150-(h?10:len)),w=h?[wx,wy,len,10]:[wx,wy,10,len];
  if(w[0]+w[2]>225&&w[1]<180)continue;if(w[0]<110&&w[1]+w[3]>H-130)continue;{const cx=cl(EX[0],w[0],w[0]+w[2]),cy=cl(EX[1],w[1],w[1]+w[3]);if(Math.hypot(EX[0]-cx,EX[1]-cy)<50)continue}walls.push(w);k++}
 const fp=()=>{for(let t=0;t<60;t++){const px=24+R()*(W-48),py=50+R()*(H-90);if(px>225&&py<175)continue;if(px<100&&py>H-120)continue;if(Math.hypot(px-EX[0],py-EX[1])<60)continue;if(!blocked(px,py,16))return[px,py]}return[180,300]};
 L={fp,R,diff};
 guards=[];for(let i=0;i<diff.g;i++)guards.push({wp:[fp(),fp(),fp()],i:0,x:0,y:0,ang:0,sp:.85,range:85,half:.45,chase:0,ls:null,stuck:0,fly:0});guards.forEach(g=>{g.x=g.wp[0][0];g.y=g.wp[0][1]});
 drones=[];for(let i=0;i<diff.d;i++){const d={wp:[fp(),fp(),fp()],i:0,x:0,y:0,ang:0,sp:1.6,range:65,half:.5,fly:1};d.x=d.wp[0][0];d.y=d.wp[0][1];drones.push(d)}
 cams=[];for(let i=0;i<diff.c;i++){const p=fp();cams.push({x:p[0],y:p[1],base:R()*6.28,amp:.6+R()*.5,ph:R()*6,sp:.8+R()*.6,range:110,half:.35,ang:0})}
 lasers=[];for(let i=0;i<diff.l;i++){const p=fp(),hz=R()<.5,ln=70+R()*40;lasers.push({x1:p[0],y1:p[1],x2:p[0]+(hz?ln:0),y2:p[1]+(hz?0:ln),ph:R()*150,on:0,hit:0})}
 sens=[];for(let i=0;i<diff.s;i++){const p=fp();sens.push({x:p[0],y:p[1],r:34,tr:0})}
 loot=[];const vm=1+lv*.12;
 for(let i=0;i<10+Math.floor(lv/3);i++){const p=fp(),r=R();loot.push(r<.6?{x:p[0],y:p[1],t:0,v:100*vm,w:1}:r<.9?{x:p[0],y:p[1],t:1,v:300*vm,w:2}:{x:p[0],y:p[1],t:2,v:700*vm,w:1})}
 for(let i=0;i<4;i++)loot.push({x:262+R()*70,y:64+R()*70,t:i%2?2:1,v:(i%2?1400:900)*vm,w:i%2?1:2});
}
function addGuard(){const p=L.fp();const g={wp:[L.fp(),L.fp(),p],i:0,x:p[0],y:p[1],ang:0,sp:.85,range:85,half:.45,chase:1,ls:[P.x,P.y],stuck:0,fly:0};guards.push(g)}
function start(m,l,sd){mode=m;lv=l;seed=sd;S='play';$('ov').style.display='none';gen(lv,seed);P={x:34,y:H-34};T=0;carry=0;wt=0;det=0;heat=0;alarm=0;outage=0;jamT=0;dbl=0;pick=0;ext=0;over=false;pa=[];pp=[];jams=1+sv.up.jam;
 const ne=1+(lv>10?1:0);evs=[];for(let i=0;i<ne;i++)evs.push({t:(8+R2()*22)*60,k:Math.floor(R2()*6)});
 const lc=LOC[(lv-1)%8];say(lc[0]+' '+lc[1]+' · LV '+lv);snd(330,.2,'triangle')}
const cap=()=>8+3*sv.up.bag;
function fireEv(k){say(EVN[k]);gl=1;snd(200,.4,'sawtooth');
 if(k===0)outage=360;
 if(k===1){addGuard();alarm=120}
 if(k===2&&door){walls=walls.filter(w=>w!==door);door=null;burst(296,154,30,'#ffcf4a')}
 if(k===3){for(const g of guards.concat(drones)){g.wp=[L.fp(),L.fp(),L.fp()];g.i=0}}
 if(k===4){const c=L.fp();for(let i=0;i<5;i++)loot.push({x:c[0]+(Math.random()-.5)*40,y:c[1]+(Math.random()-.5)*40,t:2,v:800*(1+lv*.12),w:1});pp.push({x:c[0],y:c[1],l:120,t:'?'})}
 if(k===5)dbl=600}
let gl=0;
function upd(d){
 T+=d;const sec=T/60;
 const nh=Math.min(8,Math.floor(sec/12));if(nh>heat){heat=nh;say('🚨 HEAT '+heat+' — loot ×'+(1+.2*heat).toFixed(1));snd(150,.3,'sawtooth');if(heat==3||heat==6)addGuard()}
 const mult=(1+.2*heat)*(dbl>0?2:1);dbl-=d;alarm-=d;outage-=d;jamT-=d;
 for(const e of evs)if(!e.done&&T>=e.t){e.done=1;fireEv(e.k)}
 // player
 const spd=1.7*(1+.08*sv.up.speed)*(1-Math.min(.25,wt*.015));let mx=0,my=0;
 const kx=K.r-K.l,ky=K.d-K.u;if(kx||ky){const n=Math.hypot(kx,ky);mx=kx/n*spd*d;my=ky/n*spd*d}
 else if(touch.a){const tx=touch.px+(touch.cx-touch.sx)*touch.k,ty=touch.py+(touch.cy-touch.sy)*touch.k,dx=tx-P.x,dy=ty-P.y,dl=Math.hypot(dx,dy);if(dl>3){const s=Math.min(dl,spd*d);mx=dx/dl*s;my=dy/dl*s}}
 const ox=P.x,oy=P.y;if(!blocked(P.x+mx,P.y,5))P.x+=mx;if(!blocked(P.x,P.y+my,5))P.y+=my;
 const moving=Math.hypot(P.x-ox,P.y-oy)>.2*d;
 // loot
 for(const it of loot){if(it.g)continue;if(Math.hypot(it.x-P.x,it.y-P.y)<11){if(wt+it.w<=cap()){it.g=1;wt+=it.w;const v=it.v*mult;carry+=v;burst(it.x,it.y,10,'#ffcf4a');pp.push({x:it.x,y:it.y,l:50,t:'+'+$$(v)});snd(900+it.t*200,.08)}else if(T-dwarn>60){dwarn=T;say('🎒 BAG FULL — extract!')}}}
 loot=loot.filter(i=>!i.g);
 // vault pick
 if(door){const dd=Math.hypot(P.x-296,P.y-154);if(dd<28){pick+=d/(180/(1+.3*sv.up.lock));if(pick>=1){walls=walls.filter(w=>w!==door);door=null;burst(296,154,30,'#38f0ff');say('🔓 VAULT OPEN');snd(600,.3,'triangle')}}else pick=Math.max(0,pick-d/120)}
 // guards & drones
 const hv=1+.04*heat;
 for(const g of guards.concat(drones)){let tx,ty,sp=g.sp*hv;
  if(!g.fly&&(g.chase>0||alarm>0)){if(alarm>0){g.ls=[P.x,P.y];g.chase=Math.max(g.chase,60)}tx=g.ls[0];ty=g.ls[1];sp*=1.4;g.chase-=d}else{const w=g.wp[g.i];tx=w[0];ty=w[1]}
  const dx=tx-g.x,dy=ty-g.y,dl=Math.hypot(dx,dy);
  if(dl<6){if(g.chase<=0)g.i=(g.i+1)%g.wp.length}else{const vx=dx/dl*sp*d,vy=dy/dl*sp*d;let mv=0;
   if(g.fly||!blocked(g.x+vx,g.y+vy,6)){g.x+=vx;g.y+=vy;mv=1}else if(!blocked(g.x+vx,g.y,6)){g.x+=vx;mv=1}else if(!blocked(g.x,g.y+vy,6)){g.y+=vy;mv=1}
   if(!mv){g.stuck+=d;if(g.stuck>30){g.stuck=0;g.i=(g.i+1)%g.wp.length;g.chase=0}}else g.stuck=0;
   let da=Math.atan2(dy,dx)-g.ang;da=Math.atan2(Math.sin(da),Math.cos(da));g.ang+=da*.2*d}
  if(!g.fly&&Math.hypot(g.x-P.x,g.y-P.y)<12)return caught()}
 for(const c of cams)c.ang=c.base+Math.sin(T*.02*c.sp+c.ph)*c.amp;
 // detection
 let seen=false;const dg=1-.08*sv.up.disguise,off=outage>0||jamT>0;
 const watch=(w)=>{const dx=P.x-w.x,dy=P.y-w.y,dist=Math.hypot(dx,dy),r=w.range*dg*(alarm>0?1.3:1);if(dist>r)return;let da=Math.atan2(dy,dx)-w.ang;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)>w.half)return;if(!w.fly&&!los(w.x,w.y,P.x,P.y))return;
  seen=true;det+=(1.4+(1-dist/r)*1.6)*d/(1+.25*sv.up.stealth);if(w.range===85){w.chase=90;w.ls=[P.x,P.y]}if(w.cam)alarm=Math.max(alarm,150)};
 for(const g of guards)watch(g);for(const g of drones)watch(g);if(!off)for(const c of cams){c.cam=1;watch(c)}
 if(!off){for(const l of lasers){l.on=((T+l.ph)%150)<90;if(!l.on){l.hit=0;continue}
   const vx=l.x2-l.x1,vy=l.y2-l.y1,t=cl(((P.x-l.x1)*vx+(P.y-l.y1)*vy)/(vx*vx+vy*vy),0,1);if(Math.hypot(P.x-l.x1-vx*t,P.y-l.y1-vy*t)<6&&!l.hit){l.hit=1;det+=45;alarm=240;sh=10;snd(120,.25,'sawtooth');seen=true}}
  for(const s of sens){s.tr=0;if(moving&&Math.hypot(P.x-s.x,P.y-s.y)<s.r){det+=1.6*d;s.tr=1;seen=true}}}
 else for(const l of lasers)l.on=0;
 if(!seen)det=Math.max(0,det-.6*d);
 if(det>=100)return caught();
 // extract
 if(Math.hypot(P.x-EX[0],P.y-EX[1])<24&&T>30){ext+=d;if(ext>=45)return escape()}else ext=Math.max(0,ext-d*2);
 for(const p of pa){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.l--}pa=pa.filter(p=>p.l>0);for(const p of pp){p.y-=.5;p.l--}pp=pp.filter(p=>p.l>0)}
function caught(){over=true;S='res';sh=18;burst(P.x,P.y,50,'#ff3b5c');snd(70,.7,'sawtooth',.1);
 const lost=carry;let extra='';if(mode==='endless'){sv.end=Math.max(sv.end,end-1);save();extra='<p>Endless run over after <b>'+(end-1)+'</b> heists. Banked '+$$(bank)+'.</p>'}
 setTimeout(()=>ov('<h1 style="color:var(--rd)">BUSTED</h1><p>Security caught you. You lost <b>'+$$(lost)+'</b> of loot.</p>'+extra+'<button class="p" onclick="menu()">Back to hideout</button>'),700)}
function escape(){over=true;S='res';const tot=carry*(1+.12*sv.up.veh),sec=Math.round(T/60);sv.cash+=tot;snd(660,.4,'triangle');
 let h='<h1>ESCAPED! '+VEH[Math.min(5,sv.up.veh)]+'</h1><p>Loot: '+$$(carry)+' × vehicle bonus = <b style="color:var(--gd)">'+$$(tot)+'</b><br>Time '+sec+'s · Heat '+heat+'</p>';
 if(mode==='camp'){if(!sv.best[lv]||tot>sv.best[lv])sv.best[lv]=tot;if(!sv.bt[lv]||sec<sv.bt[lv])sv.bt[lv]=sec;if(lv===sv.lv&&sv.lv<60)sv.lv++;sel=Math.min(sv.lv,lv+1);save();h+='<button class="p" onclick="start(\'camp\','+sel+','+(sel*7919)+')">Next heist: level '+sel+'</button>'}
 else if(mode==='daily'){const k=dateKey();if(!sv.daily[k]||tot>sv.daily[k])sv.daily[k]=tot;save();h+='<p>Daily best: '+$$(sv.daily[k])+'</p>'}
 else{bank+=tot;sv.end=Math.max(sv.end,end);save();end++;h+='<p>Endless bank: '+$$(bank)+'</p><button class="p" onclick="start(\'endless\','+end+','+Math.floor(Math.random()*1e9)+')">Next heist (level '+end+')</button>'}
 setTimeout(()=>ov(h+'<button onclick="menu()">Hideout &amp; upgrades</button>'),500)}
const dateKey=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
function ov(h){$('pn').innerHTML=h;$('ov').style.display='flex'}
function menu(){S='menu';const lc=LOC[(sel-1)%8],dk=dateKey();
 ov('<h1>STEAL THE GOLD</h1><p>Cash <b style="color:var(--gd)">'+$$(sv.cash)+'</b> · Endless best '+sv.end+' heists</p>'
 +'<div class="r"><button onclick="sel=Math.max(1,sel-1);menu()">◀</button><div class="lv">'+lc[0]+' '+lc[1]+'<br>Level '+sel+' / 60</div><button onclick="sel=Math.min(sv.lv,sel+1);menu()">▶</button></div>'
 +'<p style="text-align:center">'+(sv.best[sel]?'Best '+$$(sv.best[sel])+' · fastest '+sv.bt[sel]+'s':'Not yet cleared')+'</p>'
 +'<button class="p" onclick="start(\'camp\','+sel+','+(sel*7919)+')">START HEIST</button>'
 +'<button onclick="start(\'daily\',10,'+dk+')">📅 Daily Heist<small>Same vault for everyone · best '+(sv.daily[dk]?$$(sv.daily[dk]):'—')+'</small></button>'
 +'<button onclick="end=1;bank=0;start(\'endless\',1,'+Math.floor(Math.random()*1e9)+')">♾️ Endless Heist<small>Chain heists, getting harder. Get caught and it ends.</small></button>'
 +'<button onclick="ups()">🧰 Upgrades</button><p>Drag to move · stand at the vault door to pick it · reach the green EXIT zone (not where you start!) to escape. Stay longer for more loot ×, but more heat.</p>')}
function ups(){ov('<h2>🧰 Upgrades</h2><p>Cash '+$$(sv.cash)+'</p>'+UP.map(u=>{const l=sv.up[u[0]],c=Math.round(800*Math.pow(1.7,l)),mx=l>=(u[0]==='veh'?5:6);return'<button '+(mx||sv.cash<c?'disabled':'')+' onclick="buy(\''+u[0]+'\')">'+u[1]+' '+u[2]+' · lvl '+l+(u[0]==='veh'?' '+VEH[l]:'')+'<small>'+u[3]+' · '+(mx?'MAX':$$(c))+'</small></button>'}).join('')+'<button class="p" onclick="menu()">Back</button>')}
function buy(k){const l=sv.up[k],c=Math.round(800*Math.pow(1.7,l));if(sv.cash<c)return;sv.cash-=c;sv.up[k]++;save();snd(800,.1);ups()}
function jam(){if(S!=='play'||over||jams<=0)return;jams--;jamT=360;say('📡 JAMMED for 6s');snd(500,.2)}
function cone(o,col,a){x.fillStyle=col;x.globalAlpha=a;x.beginPath();x.moveTo(o.x,o.y);x.arc(o.x,o.y,o.range*(1-.08*sv.up.disguise)*(alarm>0?1.3:1),o.ang-o.half,o.ang+o.half);x.closePath();x.fill();x.globalAlpha=1}
function draw(){
 x.save();if(sh>.3){x.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);sh*=.88}
 x.fillStyle='#07060d';x.fillRect(-20,-20,W+40,H+40);
 if(S==='menu'){x.restore();return}
 const th=LOC[(lv-1)%8][2];
